[package]
name = "vk-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vapourkit"
path = "src/main.rs"

[dependencies]
vk-core = { path = "../vk-core" }
eframe = { version = "0.31", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
